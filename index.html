<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSmart Pro — Intelligent Parking System</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-purple: #a855f7;
            --accent-orange: #f97316;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px 20px;
        }

        header {
            max-width: 1300px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.4rem;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Option Selection Switcher Tabs */
        .option-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 6px;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .tab-btn.active.unpark-tab {
            background: linear-gradient(135deg, var(--accent-orange), #ea580c);
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        select.form-control option {
            background-color: #1e293b;
            color: #ffffff;
        }

        .btn-park {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-park:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-unpark {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .btn-unpark:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
        }

        .status-legend {
            display: flex;
            gap: 16px;
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.available { background-color: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
        .dot.occupied { background-color: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }

        .category-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-blue);
            margin: 18px 0 10px 0;
        }

        .grid-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 10px;
        }

        .slot-box {
            position: relative;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .slot-box.available {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
        }

        .slot-box.available:hover {
            background: rgba(16, 185, 129, 0.25);
            transform: scale(1.05);
        }

        .slot-box.occupied {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: var(--accent-red);
        }

        .slot-box.occupied:hover {
            background: rgba(244, 63, 94, 0.3);
            transform: scale(1.05);
        }

        /* Tooltip Popup */
        .slot-box .tooltip {
            visibility: hidden;
            opacity: 0;
            width: 210px;
            background-color: #1e293b;
            color: var(--text-primary);
            text-align: left;
            border-radius: 10px;
            padding: 12px;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            pointer-events: none;
            font-weight: normal;
        }

        .slot-box .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }

        .slot-box:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .tooltip-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .tooltip-row {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .tooltip-row span {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Modal Slip Display */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .slip-card {
            background: #ffffff;
            color: #1e293b;
            width: 380px;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            border-top: 6px solid var(--accent-blue);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .slip-header {
            text-align: center;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .slip-header h2 {
            font-size: 1.25rem;
            color: #0f172a;
        }

        .slip-header p {
            font-size: 0.8rem;
            color: #64748b;
        }

        .code-box {
            background: #f1f5f9;
            border: 2px dashed var(--accent-blue);
            border-radius: 10px;
            text-align: center;
            padding: 12px;
            margin: 15px 0;
        }

        .code-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.05em;
        }

        .code-box .code-val {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0284c7;
            letter-spacing: 2px;
        }

        .slip-details {
            margin-bottom: 20px;
        }

        .slip-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #475569;
        }

        .slip-row strong {
            color: #0f172a;
        }

        .total-bill-row {
            border-top: 2px solid #e2e8f0;
            padding-top: 10px;
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: #15803d;
        }

        .btn-modal-close {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-icon">P</div>
            <div>
                <h1>ParkSmart System</h1>
                <p>Smart Entry & Verified Checkout Portal</p>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- Left Sidebar: Switcher Tabs -->
        <div class="sidebar">
            
            <!-- Option Selection Tabs -->
            <div class="option-tabs">
                <button class="tab-btn active" id="tabParkBtn" onclick="switchTab('park')">Parking Vehicle</button>
                <button class="tab-btn" id="tabUnparkBtn" onclick="switchTab('unpark')">Generate Slip</button>
            </div>

            <!-- FORM 1: PARKING VEHICLE -->
            <div class="glass-card form-section active" id="parkSection">
                <div class="card-header">
                    <span class="card-title">Parking Vehicle</span>
                </div>
                
                <form id="parkForm">
                    <div class="form-group">
                        <label for="plateNumber">Plate Number</label>
                        <input type="text" id="plateNumber" class="form-control" placeholder="e.g. TS 09 AB 1234" required>
                    </div>

                    <div class="form-group">
                        <label for="vehicleType">Vehicle Category</label>
                        <select id="vehicleType" class="form-control" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="SUV">SUV (₹60 / hr)</option>
                            <option value="CAR">Car (₹40 / hr)</option>
                            <option value="BIKE">Bike (₹20 / hr)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ownerName">Owner Name</label>
                        <input type="text" id="ownerName" class="form-control" placeholder="Rahul Sharma" required>
                    </div>

                    <div class="form-group">
                        <label for="ownerPhone">Phone Number</label>
                        <input type="tel" id="ownerPhone" class="form-control" placeholder="9876543210" required>
                    </div>

                    <button type="submit" class="btn-park">Generate Code & Park</button>
                </form>
            </div>

            <!-- FORM 2: GENERATE SLIP -->
            <div class="glass-card form-section" id="unparkSection">
                <div class="card-header">
                    <span class="card-title">Generate Slip</span>
                </div>
                
                <form id="unparkForm">
                    <div class="form-group">
                        <label for="parkingCodeInput">Unique Parking Code</label>
                        <input type="text" id="parkingCodeInput" class="form-control" placeholder="e.g. PARK-8421" style="text-transform:uppercase;" required>
                    </div>

                    <button type="submit" class="btn-unpark">Verify Code & Print Slip</button>
                </form>
            </div>

        </div>

        <!-- Right Side: Floor Layout Display -->
        <div class="glass-card">
            <div class="card-header">
                <span class="card-title">Floor 1 Slot Layout</span>
                <div class="status-legend">
                    <div class="legend-item"><div class="dot available"></div> Available (<span id="availCount">40</span>)</div>
                    <div class="legend-item"><div class="dot occupied"></div> Occupied (<span id="occCount">0</span>)</div>
                </div>
            </div>

            <!-- SUV Slots -->
            <div class="category-label">SUV Slots (1 to 15)</div>
            <div class="grid-slots" id="suvGrid"></div>

            <!-- Car Slots -->
            <div class="category-label">Car Slots (16 to 30)</div>
            <div class="grid-slots" id="carGrid"></div>

            <!-- Bike Slots -->
            <div class="category-label">Bike Slots (31 to 40)</div>
            <div class="grid-slots" id="bikeGrid"></div>
        </div>

    </div>

    <!-- Generated Ticket/Slip Overlay Modal -->
    <div class="modal-overlay" id="slipModal">
        <div class="slip-card">
            <div class="slip-header">
                <h2>ParkSmart Digital Slip</h2>
                <p id="slipModalSubtitle">Parking Confirmation Ticket</p>
            </div>

            <div class="code-box">
                <div class="label">Your Unique Security Code</div>
                <div class="code-val" id="modalCode">PARK-0000</div>
            </div>

            <div class="slip-details" id="modalDetails">
                <!-- Dynamic Content injected via JS -->
            </div>

            <button class="btn-modal-close" onclick="closeModal()">Close Slip</button>
        </div>
    </div>

    <script>
        // Data Structure for 40 Slots
        const slotsData = [];

        // Hourly Rates (INR)
        const rates = { SUV: 60, CAR: 40, BIKE: 20 };

        // Populate slots
        for (let i = 1; i <= 15; i++) slotsData.push({ id: i, type: 'SUV', isOccupied: false, code: null, details: null });
        for (let i = 16; i <= 30; i++) slotsData.push({ id: i, type: 'CAR', isOccupied: false, code: null, details: null });
        for (let i = 31; i <= 40; i++) slotsData.push({ id: i, type: 'BIKE', isOccupied: false, code: null, details: null });

        // Switcher Tab Navigation
        function switchTab(option) {
            const parkBtn = document.getElementById('tabParkBtn');
            const unparkBtn = document.getElementById('tabUnparkBtn');
            const parkSec = document.getElementById('parkSection');
            const unparkSec = document.getElementById('unparkSection');

            if (option === 'park') {
                parkBtn.className = 'tab-btn active';
                unparkBtn.className = 'tab-btn';
                parkSec.className = 'glass-card form-section active';
                unparkSec.className = 'glass-card form-section';
            } else {
                parkBtn.className = 'tab-btn';
                unparkBtn.className = 'tab-btn active unpark-tab';
                parkSec.className = 'glass-card form-section';
                unparkSec.className = 'glass-card form-section active';
            }
        }

        // Generate unique code
        function generateUniqueCode() {
            return 'PARK-' + Math.floor(1000 + Math.random() * 9000);
        }

        // Render slot grids
        function renderGrids() {
            const suvGrid = document.getElementById('suvGrid');
            const carGrid = document.getElementById('carGrid');
            const bikeGrid = document.getElementById('bikeGrid');

            suvGrid.innerHTML = '';
            carGrid.innerHTML = '';
            bikeGrid.innerHTML = '';

            let occupiedCount = 0;

            slotsData.forEach(slot => {
                if (slot.isOccupied) occupiedCount++;

                const slotElem = document.createElement('div');
                slotElem.className = `slot-box ${slot.isOccupied ? 'occupied' : 'available'}`;
                slotElem.innerText = slot.id;

                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';

                if (slot.isOccupied) {
                    tooltip.innerHTML = `
                        <div class="tooltip-title">Slot #${slot.id} (${slot.type})</div>
                        <div class="tooltip-row">Code: <span>${slot.code}</span></div>
                        <div class="tooltip-row">Plate: <span>${slot.details.plate}</span></div>
                        <div class="tooltip-row">Owner: <span>${slot.details.owner}</span></div>
                        <div class="tooltip-row">Phone: <span>${slot.details.phone}</span></div>
                        <div class="tooltip-row">Time: <span>${slot.details.timeStr}</span></div>
                    `;
                } else {
                    tooltip.innerHTML = `
                        <div class="tooltip-title">Slot #${slot.id} (${slot.type})</div>
                        <div class="tooltip-row" style="color: var(--accent-green); font-weight:600;">Status: Available</div>
                    `;
                }

                slotElem.appendChild(tooltip);

                if (slot.type === 'SUV') suvGrid.appendChild(slotElem);
                else if (slot.type === 'CAR') carGrid.appendChild(slotElem);
                else if (slot.type === 'BIKE') bikeGrid.appendChild(slotElem);
            });

            document.getElementById('occCount').innerText = occupiedCount;
            document.getElementById('availCount').innerText = 40 - occupiedCount;
        }

        // Handle Parking Form Submission
        document.getElementById('parkForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const plate = document.getElementById('plateNumber').value;
            const type = document.getElementById('vehicleType').value;
            const owner = document.getElementById('ownerName').value;
            const phone = document.getElementById('ownerPhone').value;

            const slot = slotsData.find(s => s.type === type && !s.isOccupied);

            if (!slot) {
                alert(`Sorry, all ${type} slots are currently full!`);
                return;
            }

            const code = generateUniqueCode();
            const now = new Date();

            slot.isOccupied = true;
            slot.code = code;
            slot.details = {
                plate: plate,
                owner: owner,
                phone: phone,
                entryTime: now,
                timeStr: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            renderGrids();
            document.getElementById('parkForm').reset();

            showModal("Parking Confirmation Ticket", code, `
                <div class="slip-row">Slot Assigned: <strong>Slot #${slot.id} (${type})</strong></div>
                <div class="slip-row">Vehicle Plate: <strong>${plate}</strong></div>
                <div class="slip-row">Owner Name: <strong>${owner}</strong></div>
                <div class="slip-row">Phone Number: <strong>${phone}</strong></div>
                <div class="slip-row">Entry Time: <strong>${slot.details.timeStr}</strong></div>
                <p style="margin-top:10px; font-size:0.75rem; color:#dc2626; text-align:center;">
                    * Save this Unique Code. Required for option 2 (Generate Slip)!
                </p>
            `);
        });

        // Handle Generate Slip Form Submission
        document.getElementById('unparkForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const inputCode = document.getElementById('parkingCodeInput').value.trim().toUpperCase();

            const slot = slotsData.find(s => s.isOccupied && s.code === inputCode);

            if (!slot) {
                alert("Invalid Security Code! No active vehicle found matching code: " + inputCode);
                return;
            }

            const exitTime = new Date();
            const durationMs = exitTime - slot.details.entryTime;
            let hours = Math.ceil(durationMs / (1000 * 60 * 60));
            if (hours === 0) hours = 1;

            const totalBill = hours * rates[slot.type];
            const exitedDetails = { ...slot.details, slotId: slot.id, type: slot.type };

            // Vacate slot
            slot.isOccupied = false;
            slot.code = null;
            slot.details = null;

            renderGrids();
            document.getElementById('unparkForm').reset();

            showModal("Exit Receipt & Payment Slip", inputCode, `
                <div class="slip-row">Slot Vacated: <strong>Slot #${exitedDetails.slotId} (${exitedDetails.type})</strong></div>
                <div class="slip-row">Vehicle Plate: <strong>${exitedDetails.plate}</strong></div>
                <div class="slip-row">Owner Name: <strong>${exitedDetails.owner}</strong></div>
                <div class="slip-row">Billed Duration: <strong>${hours} Hour(s)</strong></div>
                <div class="slip-row">Hourly Rate: <strong>₹${rates[exitedDetails.type]}/hr</strong></div>
                <div class="slip-row total-bill-row">
                    <span>Total Bill Amount:</span>
                    <span>₹${totalBill}</span>
                </div>
            `);
        });

        function showModal(subtitle, code, htmlDetails) {
            document.getElementById('slipModalSubtitle').innerText = subtitle;
            document.getElementById('modalCode').innerText = code;
            document.getElementById('modalDetails').innerHTML = htmlDetails;
            document.getElementById('slipModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('slipModal').style.display = 'none';
        }

        // Initialize empty grids on load
        renderGrids();
    </script>
</body>
</html>
